; A menu.ini as a server has one: lang keys for the words, conditions and
; actions a plugin registers, a list of players with a filter.

[MAIN]
PREFIX = MY_CHAT_PREFIX
KEY = {
	EXIT     = MY_MENU_EXIT
	NUMBER   = MY_MENU_NUMBER
	DISABLED = MY_MENU_NUMBER_DISABLED
}

[MAIN_MENU]
TITLE = MY_MENU_MAIN_TITLE
HIDE_BACK = YES
ITEMS = {
	; name | placeholder | condition | action | restriction | message | spacing
	"MY_MENU_RESET_SCORE" "" "" "RESET_SCORE" "" "" ""
	"MY_MENU_ADMIN" "" "IS_ADMIN" "SHOW_ADMIN_MENU" "FLAG_d" "" ""
	"MY_MENU_SETTINGS" "" "" "SHOW_SETTINGS_MENU" "" "" "1"
	"MY_MENU_SPECTATE|MY_MENU_JOIN" "" "!IS_SPECTATOR|IS_SPECTATOR" "JOIN_SPECTATE|JOIN_TEAM" "" "" ""
}

[ADMIN_MENU]
TITLE = MY_MENU_ADMIN_TITLE
ACTIVE_ON = IS_ADMIN
ITEMS = {
	"MY_MENU_DM_MODE" "%dm_status%" "" "TOGGLE_DM" "FLAG_d" "" ""
	"MY_MENU_SOLO_MODE" "%solo_status%" "" "TOGGLE_SOLO" "FLAG_d" "" ""
}

[SETTINGS_MENU]
TITLE = MY_MENU_SETTINGS_TITLE
ITEMS = {
	"MY_MENU_HIDE_KNIFE" "" "" "TOGGLE_HIDE_KNIFE" "" "" ""
	"MY_MENU_FOV" "" "" "INPUT_FOV" "" "" ""
}

[LIST_SPECTATORS]
TITLE = MY_MENU_SPECTATORS_TITLE
FILTER = {
	"IS_SPECTATOR" "MY_CHAT_NO_SPECTATORS"
}
VIEW = {
	"%name%" "" "SWAP" "" ""
}

[LIST_PLAYERS]
TITLE = MY_MENU_PLAYERS_TITLE
VIEW = {
	"%name%" "" "PLAYER_ACTION" "" ""
}
